<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Plainpage: a sheet of warm paper on a Big Sur-style plate -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#F6F3EC"/>
  <!-- faint page rules -->
  <g stroke="#DDD8CC" stroke-width="6">
    <line x1="220" y1="330" x2="804" y2="330"/>
    <line x1="220" y1="450" x2="804" y2="450"/>
    <line x1="220" y1="570" x2="804" y2="570"/>
    <line x1="220" y1="690" x2="804" y2="690"/>
  </g>
  <!-- the P, navy ink, serif -->
  <text x="512" y="700" font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="560" text-anchor="middle" fill="#13294B">P</text>
  <!-- orange baseline rule -->
  <rect x="330" y="770" width="364" height="34" rx="17" fill="#FF5F05"/>
</svg>
